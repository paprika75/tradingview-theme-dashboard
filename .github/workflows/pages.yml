name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data and decision logic
        run: |
          node --test tests/*.test.mjs
          python tests/validate_data.py
          python tests/test_live.py
          python tests/test_market_outlook.py
          python tests/test_market_exposure.py
          python tests/test_pre_setup.py
          python tests/test_setup_lifecycle.py
          python tests/test_live_setup_state.py
          python tests/test_setup_journey.py
      - uses: actions/configure-pages@v5
      - name: Stage static files
        run: python scripts/stage_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
