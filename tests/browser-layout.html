<!doctype html><html lang="ja"><meta charset="utf-8"><title>PC layout QA — Theme Atlas</title><style>body{margin:0;background:#0b111a;color:#d9e2ed;font:13px sans-serif}header{position:sticky;top:0;padding:10px;background:#172231;z-index:10}button{padding:7px 12px;background:#293b50;color:white;border:0;margin:0 5px}iframe{border:1px solid #53617a;height:1000px;margin:12px;display:block}</style><header>PC layout QA <button data-width="1280">1280px</button><button data-width="1440">1440px</button><button data-market="us">米国株</button><button data-market="japan">日本株</button><span id="size">1280px</span></header><iframe title="PC dashboard preview" src="us.html?period=daily" width="1280"></iframe><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('#size').textContent=b.dataset.width+'px';});document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{document.querySelector('iframe').src=b.dataset.market+'.html?period=daily';});</script></html>
